name: Build and Deploy

# Every push to master builds and deploys to GitHub Pages.
# Pull requests only build, as a CI check -- they never deploy.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4 stopped bundling dotfiles by default. Without this, dist/.nojekyll
          # is silently dropped from the artifact. The deploy job never runs on a
          # pull request, so nothing here would catch that before it reached the
          # live site.
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
